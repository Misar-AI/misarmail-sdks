[package]
name = "misarmail"
version = "1.0.0"
edition = "2021"
description = "Async Rust client for MisarMail's transactional and marketing email API: send mail, run campaigns and A/B tests, manage contacts, segments, templates and automations, verify domains and DMARC, validate addresses, track revenue and read analytics. Retries, typed plan-limit errors, SSE streaming."
license = "MIT"
authors = ["Misar AI <hello@misar.io>"]
homepage = "https://misarmail.com/docs/sdks/rust"
repository = "https://github.com/Misar-AI/misarmail-sdks"
documentation = "https://docs.rs/misarmail"
keywords = ["email", "transactional", "newsletter", "deliverability", "api-client"]
categories = ["api-bindings", "email", "web-programming::http-client", "asynchronous"]
readme = "README.md"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
urlencoding = "2"
futures-util = "0.3"
serde_json = "1"
thiserror = "1"

[dev-dependencies]
wiremock = "0.6"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
