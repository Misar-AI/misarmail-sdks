name: misarmail
description: "Send transactional email and run marketing campaigns from Dart: MisarMail's API for sends, campaigns, contacts, templates, domains, validation, analytics, webhooks and SSE."
version: 5.0.3
homepage: https://www.misarmail.com
repository: https://github.com/Misar-AI/misarmail-sdks
issue_tracker: https://github.com/Misar-AI/misarmail-sdks/issues
documentation: https://docs.misar.io/mail

topics:
  - email
  - transactional-email
  - marketing
  - api-client
  - webhooks

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  http: ^1.2.0
  crypto: ^3.0.3

dev_dependencies:
  test: ^1.25.0
  lints: ^3.0.0
  build_runner: ^2.4.9
