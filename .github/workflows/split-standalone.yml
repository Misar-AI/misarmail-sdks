name: Split PHP/Swift to standalone repos

# Packagist cannot index a subdirectory and SwiftPM cannot resolve one, so those
# two SDKs are consumed from their own repositories with the package manifest at
# the root. This job keeps them from going stale.
#
# For Swift the tag IS the release: SwiftPM resolves versions from git tags in
# the repository it was pointed at, so the plain `vX.Y.Z` tag pushed here is what
# consumers get. For PHP, Packagist reads tags the same way — but only for a
# package it has been told about, which is what publish-php.yml does at the end
# of this workflow.
#
# Pushing to ANOTHER repository is the one thing here that genuinely needs a
# PAT: the default GITHUB_TOKEN is scoped to this repository alone. That is
# SPLIT_TOKEN, and it is not configured yet — so the split job fails loudly
# while the Packagist registration below still runs, because registering a
# package needs no push token at all.

on:
  push:
    tags: ['php/v*', 'swift/v*']
  workflow_dispatch:
    inputs:
      language:
        description: 'Which SDK to split'
        required: true
        type: choice
        options: [php, swift]
      version:
        description: 'Version to tag (without the leading v)'
        required: true
        type: string

jobs:
  # Resolving the target in its own job means the Packagist job below can read
  # these values even when the split fails for want of SPLIT_TOKEN. Job outputs
  # of a failed job are not something to bet a release on.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      lang: ${{ steps.target.outputs.lang }}
      version: ${{ steps.target.outputs.version }}
      target: ${{ steps.target.outputs.target }}
    steps:
      - name: Resolve language and version
        id: target
        env:
          INPUT_LANG: ${{ inputs.language }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Not named LANG: that is the locale variable, and exporting
          # LANG=php to later steps makes half the GNU toolchain complain.
          if [ -n "${INPUT_LANG:-}" ]; then
            SDK_LANG="$INPUT_LANG"
            VERSION="${INPUT_VERSION:-}"
          else
            # refs/tags/php/v1.2.3 -> php, 1.2.3
            REF="${GITHUB_REF#refs/tags/}"
            SDK_LANG="${REF%%/*}"
            VERSION="${REF##*/v}"
          fi
          case "$SDK_LANG" in
            php|swift) ;;
            *) echo "::error::unsupported language '${SDK_LANG}'"; exit 1 ;;
          esac
          # Guard on the VALUE: a parameter expansion that does not match hands
          # back the original string, silently and with a zero exit status.
          if ! grep -qE '^[0-9]+\.[0-9]+\.[0-9]+' <<< "$VERSION"; then
            echo "::error::could not determine a version (got '${VERSION}') from ref '${GITHUB_REF}'."
            exit 1
          fi
          TARGET="${GITHUB_REPOSITORY##*/}"       # misarmail-sdks
          TARGET="${TARGET%-sdks}-${SDK_LANG}"    # misarmail-php
          echo "lang=$SDK_LANG"    >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "target=$TARGET"    >> "$GITHUB_OUTPUT"
          echo "::notice::${SDK_LANG} v${VERSION} → ${TARGET}"

  split:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push the subdirectory to its standalone repository
        env:
          TOKEN: ${{ secrets.SPLIT_TOKEN || secrets.RELEASE_TOKEN || secrets.GH_SYNC_TOKEN }}
          SDK_LANG: ${{ needs.resolve.outputs.lang }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET: ${{ needs.resolve.outputs.target }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::None of SPLIT_TOKEN, RELEASE_TOKEN or GH_SYNC_TOKEN is set. Pushing to ${TARGET} is a cross-repository write, which the default GITHUB_TOKEN cannot do. Create a PAT with contents:write on ${GITHUB_REPOSITORY_OWNER}/${TARGET} and store it as SPLIT_TOKEN."
            exit 1
          fi
          git clone --quiet \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/${TARGET}.git" \
            /tmp/standalone

          # --delete so a file removed upstream is removed here too; the .git
          # directory is preserved because rsync targets the worktree only.
          rsync -a --delete --exclude .git --exclude vendor --exclude .build \
            "${SDK_LANG}/" /tmp/standalone/

          cd /tmp/standalone
          git config user.email "ci@misar.io"
          git config user.name "Misar CI"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::no content change; tagging the existing HEAD"
          else
            git commit -q \
              -m "chore: sync ${SDK_LANG} SDK v${VERSION} from the monorepo" \
              -m "Generated by split-standalone.yml. The monorepo is the source of truth."
          fi

          # Idempotent: re-running a release must not fail on an existing tag,
          # but must never move one either — a moved tag changes what a resolved
          # dependency points at.
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::notice::tag v${VERSION} already exists; leaving it alone"
          else
            git tag -a "v${VERSION}" -m "v${VERSION}"
          fi
          git push -q origin main
          git push -q origin "v${VERSION}"
          echo "::notice::${TARGET} now at v${VERSION}"

  # Registering with Packagist and asking it to re-crawl. It runs after the
  # split so a re-crawl reads the tag the split just pushed rather than the
  # previous release — that ordering is why this is not its own tag-triggered
  # workflow. `!cancelled()` rather than `success()`: registration needs no
  # push token, so it must still happen when the split fails for want of one.
  packagist:
    needs: [resolve, split]
    if: ${{ !cancelled() && needs.resolve.outputs.lang == 'php' }}
    uses: ./.github/workflows/publish-php.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      repository: https://github.com/${{ github.repository_owner }}/${{ needs.resolve.outputs.target }}
    secrets: inherit
