name: Validate & Tag Swift SDK

# SPM resolves directly from GitHub tags — the tag itself is the "publish", so
# there is no registry upload and no credential.
#
# Consumers depend on misarmail-swift, NOT this monorepo: SwiftPM requires
# Package.swift at the repository root and cannot resolve a subdirectory.
# split-standalone.yml mirrors swift/ there and pushes the vX.Y.Z tag that
# SPM actually resolves; this job is the gate that it compiles and passes
# tests first.
# Consumers add: .package(url: "https://github.com/Misar-AI/misarmail-swift.git", from: "1.0.0")
#
# Callable as a reusable workflow so auto-tag.yml can invoke it in its own run
# (a tag pushed with the default GITHUB_TOKEN never fires `push: tags`).
# auto-tag.yml does not currently tag swift/: there is no version manifest to
# derive a version from, so swift tags are still cut by hand.
on:
  push:
    tags: ['swift/v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version being validated (informational — the git tag is the release)'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version being validated (informational — the git tag is the release)'
        required: false
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Linux on purpose: URLSession's async data(for:)/bytes(for:) do not exist in
    # swift-corelibs-foundation, so a macOS build passes while the package is
    # unusable there. That gap reached main once already.
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release
        working-directory: swift
      - run: swift test
        working-directory: swift
