name: Publish Rust SDK

# Callable as a reusable workflow so auto-tag.yml can invoke it in its own run:
# a tag pushed with the default GITHUB_TOKEN never fires `push: tags`, so the
# tag-driven path alone had never once published. See auto-tag.yml.
on:
  push:
    tags: ['rust/v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version being released (informational — cargo reads rust/Cargo.toml)'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version being released (informational — cargo reads rust/Cargo.toml)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Fail before the build, with the name of the missing secret.
      - name: Preflight — required credentials
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set for this repository — the misarmail crate cannot be published. Add it under Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi
          echo "CARGO_REGISTRY_TOKEN is present (secret values are never printed)."

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test
        working-directory: rust
      - run: cargo publish --token "$CARGO_TOKEN"
        working-directory: rust
        env:
          CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
