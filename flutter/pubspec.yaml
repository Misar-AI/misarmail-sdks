name: misarmail_flutter
description: "Send transactional email and run marketing campaigns from Flutter apps: MisarMail's API with secure key storage, retries and SSE streaming on iOS, Android, macOS and web."
version: 5.0.2
homepage: https://misarmail.com/docs/sdks/flutter
repository: https://github.com/Misar-AI/misarmail-sdks
issue_tracker: https://github.com/Misar-AI/misarmail-sdks/issues
documentation: https://misarmail.com/docs

topics:
  - email
  - transactional-email
  - marketing
  - api-client
  - secure-storage

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  crypto: ^3.0.3
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  # No assets or fonts needed for SDK
